# version: "3.8"

services:
  web:
    build: .
    command: npm run dev
    container_name: justflix-app
    environment:
      - PORT_HOST
    ports:
      - "${PORT_HOST}:${PORT}"
    volumes:
      - .:/usr/src/app
      - justflix_node_modules:/usr/src/app/node_modules
    env_file:
      - .env

volumes:
  justflix_node_modules: